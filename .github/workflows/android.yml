name: Build AnanyaS Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build Ionic Angular web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        id: upload_apk
        uses: actions/upload-artifact@v5
        with:
          name: AnanyaS-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Add APK QR code to workflow summary
        env:
          APK_ARTIFACT_URL: ${{ steps.upload_apk.outputs.artifact-url }}
        run: |
          ENCODED_URL=$(python3 -c "import os, urllib.parse; print(urllib.parse.quote(os.environ['APK_ARTIFACT_URL'], safe=''))")
          QR_CODE_URL="https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=${ENCODED_URL}"

          echo "## Download AnanyaS Android App" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Scan this QR code with your mobile phone to open the APK artifact download page:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[![Download AnanyaS APK](${QR_CODE_URL})](${APK_ARTIFACT_URL})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download AnanyaS Debug APK](${APK_ARTIFACT_URL})" >> "$GITHUB_STEP_SUMMARY"
